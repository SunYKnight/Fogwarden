[package]
name = "fogwarden"
version = "0.1.0"
description = "Fogwarden"
edition = "2021"
rust-version = "1.89"
license = "MIT"
repository = "https://github.com/SunYKnight/Fogwarden"

[lib]
name = "fogwarden_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
axum = { version = "0.8", features = ["ws"] }
tokio = { version = "1", features = ["net", "sync", "fs", "macros", "rt", "time"] }
tokio-util = { version = "0.7", features = ["io"] }
getrandom = "0.3"
if-addrs = "0.15.0"
tauri-plugin-dialog = "2"
russh = { version = "0.64.1", default-features = false, features = ["ring", "rsa"] }

[profile.release]
codegen-units = 1
lto = true
strip = true

[dev-dependencies]
futures-util = { version = "0.3.34", default-features = false, features = ["sink"] }
tokio-tungstenite = "0.29.0"
tokio = { version = "1", features = ["process", "io-util"] }
