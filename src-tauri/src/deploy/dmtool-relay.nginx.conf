# DM Tool relay site, generated by the DM Tool. certbot adds HTTPS to it.
server {
    listen 80;
    listen [::]:80;
    server_name @DOMAIN@;

    # Player bundles and map uploads go up to 128 MiB.
    client_max_body_size 128m;

    location / {
        proxy_pass http://127.0.0.1:@PORT@;
        # nginx before 1.29.7 (Ubuntu 22.04/24.04) proxies with HTTP/1.0.
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Sec-WebSocket-Protocol carries the DM login and passes unchanged:
    # nginx forwards all request headers except Host and Connection.
    location /ws {
        proxy_pass http://127.0.0.1:@PORT@;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Upgrade and Connection are hop-by-hop and must be set explicitly.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        # Quiet sessions (a paused game) must not drop after nginx's 60 s.
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }
}
